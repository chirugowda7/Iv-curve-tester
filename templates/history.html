<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Measurement History - IV Curve Tester</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            margin: 0;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background-color: #ffffff;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            padding: 0.75rem 2rem;
            margin-bottom: 2rem;
        }

        .navbar-brand {
            font-weight: 700;
            color: #1e3a8a;
            font-size: 1.1rem;
        }

        .navbar-brand i {
            color: #2563eb;
        }

        /* Card */
        .data-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
            padding: 2rem;
        }
        
        .card-header-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
        }

        .card-header-title i {
            color: #2563eb;
            margin-right: 0.75rem;
        }

        /* Table */
        .table {
            margin-bottom: 0;
        }

        .table thead th {
            border-bottom: 2px solid #e2e8f0;
            color: #64748b;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 1rem;
        }

        .table tbody td {
            padding: 1rem;
            vertical-align: middle;
            color: #334155;
            border-bottom: 1px solid #f1f5f9;
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #f8fafc;
        }

        /* Button */
        .btn-outline-custom {
            font-weight: 500;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            background-color: transparent;
            color: #475569;
            border: 1px solid #cbd5e1;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-outline-custom:hover {
            background-color: #f8fafc;
            color: #0f172a;
            border-color: #94a3b8;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg d-flex justify-content-between">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <i class="fas fa-solar-panel"></i>
        IV Curve Tester
    </a>
    <a href="/dashboard" class="btn-outline-custom btn-sm">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>
</nav>

<div class="container pb-5">
    
    <div class="data-card">
        <h2 class="card-header-title">
            <i class="fas fa-history"></i> Measurement History
        </h2>
        
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead>
                    <tr>
                        <th>Record ID</th>
                        <th>Voc (V)</th>
                        <th>Isc (A)</th>
                        <th>Vmp (V)</th>
                        <th>Imp (A)</th>
                        <th>Pmax (W)</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in data %}
                    <tr>
                        <td><strong>#{{row.id}}</strong></td>
                        <td>{{row.voc}}</td>
                        <td>{{row.isc}}</td>
                        <td>{{row.vmp}}</td>
                        <td>{{row.imp}}</td>
                        <td><strong style="color: #16a34a">{{row.pmax}}</strong></td>
                        <td>
                            <form action="/delete/{{row.id}}" method="POST" style="display:inline;">
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this record?');" title="Delete Record">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="7" class="text-center py-4 text-muted">
                            No measurements recorded yet.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
