<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IV Curve Tester</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Google Fonts: Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .main-container {
        width: 100%;
        max-width: 1400px;
        display: flex;
        align-items: center;
        padding: 2rem 4rem;
        gap: 4rem;
    }

    .left-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .right-panel {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 600px;
    }

    h1 {
        font-size: 4rem;
        font-weight: 800;
        color: #0284c7;
        margin-bottom: 0.5rem;
    }

    .subtitle {
        color: #475569;
        font-size: 1.2rem;
        font-weight: 500;
        margin-bottom: 3rem;
    }

    .info-boxes {
        display: flex;
        gap: 1rem;
        margin-bottom: 3rem;
    }

    .info-box {
        background-color: #ffffff;
        border-radius: 12px;
        padding: 1.25rem;
        flex: 1;
        border: 1px solid #e2e8f0;
        text-align: center;
    }

    .info-box-title {
        font-weight: 700;
        font-size: 1.1rem;
        color: #0f172a;
        margin-bottom: 0.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
    }

    .info-box-desc {
        color: #64748b;
        font-size: 0.85rem;
        font-weight: 500;
    }
    
    .icon-orange { color: #f97316; }
    .icon-yellow { color: #eab308; }
    .icon-white { color: #0f172a; }

    .action-buttons {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.5rem;
    }

    .btn-pill {
        border-radius: 50px;
        padding: 0.8rem 2rem;
        font-weight: 600;
        font-size: 1.1rem;
        text-decoration: none;
        transition: opacity 0.2s;
    }
    
    .btn-pill:hover {
        opacity: 0.8;
        color: white;
    }

    .btn-launch {
        background-color: #1e40af;
        color: white;
    }




</style>

</head>

<body>

<div class="main-container">
    <div class="left-panel">
        <h1>IV Curve Tester</h1>
        <div class="subtitle">Next-Generation Solar PV Module Analyzer</div>
        
        <div class="info-boxes">
            <div class="info-box">
                <div class="info-box-title">
                    <i class="fas fa-bolt icon-orange"></i> Voc
                </div>
                <div class="info-box-desc">Open Circuit Voltage</div>
            </div>
            
            <div class="info-box">
                <div class="info-box-title">
                    <i class="fas fa-battery-half icon-yellow"></i> Isc
                </div>
                <div class="info-box-desc">Short Circuit Current</div>
            </div>
            
            <div class="info-box">
                <div class="info-box-title">
                    <i class="fas fa-chart-line icon-white"></i> I-V Curve
                </div>
                <div class="info-box-desc">Real-Time Analysis</div>
            </div>
        </div>

        <div class="action-buttons">
            <a href="/dashboard" class="btn-pill btn-launch">Launch Dashboard</a>
        </div>
    </div>

    <div class="right-panel">
        <div id="model-container" style="width: 100%; height: 100%; cursor: grab;">
            <!-- Three.js Interactive 3D Model will be injected here -->
        </div>
    </div>
</div>

<!-- Three.js Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="/static/js/tester3d.js"></script>

<script>
    // Initialize 3D Model from external script (same as dashboard)
    window.addEventListener('DOMContentLoaded', () => {
        const model = initTester3D('model-container', true);
        if (model) {
            model.updateScreen('21.50', '5.20');
        }
    });
</script>

</body>
</html>
