<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INIT // IV Curve Tester</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #f8fafc;
            --neon-cyan: #0ea5e9;
            --neon-blue: #2563eb;
            --neon-purple: #9333ea;
            --grid-color: rgba(147, 51, 234, 0.15); /* Slightly purple tint for signup grid */
            --panel-bg: rgba(255, 255, 255, 0.85);
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
            color: #0f172a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            overflow: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(255, 255, 255, 0) 50%, rgba(0, 0, 0, 0.05) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
            opacity: 0.3;
        }

        .auth-container {
            position: relative;
            z-index: 10;
            max-width: 450px;
            width: 100%;
            padding: 50px 40px;
            background: var(--panel-bg);
            border: 1px solid var(--neon-purple);
            box-shadow: 0 0 20px rgba(147, 51, 234, 0.1), inset 0 0 30px rgba(147, 51, 234, 0.05);
            clip-path: polygon(
                0 20px, 20px 0, 
                100% 0, 100% calc(100% - 20px), 
                calc(100% - 20px) 100%, 0 100%
            );
            backdrop-filter: blur(10px);
            text-align: center;
        }
        
        .auth-container::before {
            content: ''; position: absolute; top: 0; left: 20px; width: 40px; height: 2px; background: var(--neon-cyan);
        }
        .auth-container::after {
            content: ''; position: absolute; bottom: 0; right: 20px; width: 40px; height: 2px; background: var(--neon-cyan);
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
            font-weight: 800;
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .subtitle {
            color: #64748b;
            font-size: 1.1rem;
            margin-bottom: 40px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-control {
            background: rgba(147, 51, 234, 0.05);
            border: 1px solid rgba(147, 51, 234, 0.2);
            color: #0f172a;
            border-radius: 0;
            padding: 12px 20px;
            margin-bottom: 25px;
            font-size: 1.1rem;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(147, 51, 234, 0.05);
            text-align: center;
            letter-spacing: 2px;
        }
        
        .form-control::placeholder {
            color: rgba(15, 23, 42, 0.4);
        }

        .form-control:focus {
            background: rgba(147, 51, 234, 0.1);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.2), inset 0 0 10px rgba(147, 51, 234, 0.1);
            color: #0f172a;
        }

        .btn-start {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            padding: 15px;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
            transition: all 0.3s ease;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            position: relative;
            overflow: hidden;
        }

        .btn-start::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.4), transparent);
            transition: left 0.5s ease;
        }

        .btn-start:hover {
            background: rgba(14, 165, 233, 0.15);
            color: #0284c7;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.2);
        }
        
        .btn-start:hover::before { left: 100%; }

        .flash-message {
            color: #ff007f;
            background: rgba(255, 0, 127, 0.1);
            border: 1px dashed rgba(255, 0, 127, 0.5);
            padding: 10px;
            margin-bottom: 25px;
            font-size: 1rem;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }

        .link-text {
            color: #64748b;
            margin-top: 35px;
            font-size: 1rem;
            display: block;
        }

        .link-text a {
            color: var(--neon-cyan);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
            letter-spacing: 1px;
        }

        .link-text a:hover {
            color: #0284c7;
            text-shadow: 0 0 10px rgba(14, 165, 233, 0.4);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1 class="title">NEW IDENTITY</h1>
        <p class="subtitle">// Register Telemetry Node</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-message">
                    <i class="fas fa-exclamation-triangle me-2"></i> {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="/signup">
            <input type="text" class="form-control" name="username" placeholder="[ NEW_USER_ID ]" required autofocus>
            <input type="password" class="form-control" name="password" placeholder="[ SET_SECURE_KEY ]" required>
            <button type="submit" class="btn-start">INITIALIZE RECORD</button>
        </form>

        <div class="link-text">
            EXISTING RECORD FOUND? <a href="/login">AUTHENTICATE HERE</a><br><br>
            <a href="/" style="color: #6c757d;">&lt; ABORT &amp; RETURN &gt;</a>
        </div>
    </div>

</body>
</html>
